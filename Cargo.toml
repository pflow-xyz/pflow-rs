[workspace]
resolver = "2"
members = [
    "crates/pflow-core",
    "crates/pflow-metamodel",
    "crates/pflow-parser",
    "crates/pflow-solver",
    "crates/pflow-learn",
    "crates/pflow-tokenmodel",
    "crates/pflow-dsl",
    "crates/pflow-macros",
    "crates/pflow-zk",
    "crates/pflow-zk-arkworks",
    "crates/pflow-zk-risc0",
    "crates/pflow",
    "crates/pflow-cli",
    "crates/pflow-mcp",
    "crates/pflow-tropical",
    "crates/pflow-reachability",
    "crates/pflow-validation",
    "crates/pflow-verify",
    "crates/pflow-compose",
    "crates/pflow-eventlog",
    "crates/pflow-mining",
    "crates/pflow-results",
    "crates/pflow-statemachine",
    "crates/pflow-workflow",
    "crates/pflow-actor",
    "crates/pflow-eventsource",
    "crates/pflow-engine",
    "crates/pflow-monitoring",
    "crates/pflow-visualization",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pflow-xyz/pflow-rs"
homepage = "https://pflow.xyz"
