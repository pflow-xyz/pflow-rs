[workspace]
resolver = "2"
members = [
    "crates/pflow-core",
    "crates/pflow-metamodel",
    "crates/pflow-parser",
    "crates/pflow-solver",
    "crates/pflow-learn",
    "crates/pflow-tokenmodel",
    "crates/pflow-dsl",
    "crates/pflow-macros",
    "crates/pflow-zk",
    "crates/pflow-zk-arkworks",
    "crates/pflow",
    "crates/pflow-cli",
    "crates/pflow-mcp",
    "crates/pflow-tropical",
    "crates/pflow-reachability",
    "crates/pflow-validation",
    "crates/pflow-verify",
    "crates/pflow-compose",
    "crates/pflow-eventlog",
    "crates/pflow-mining",
    "crates/pflow-results",
    "crates/pflow-visualization",
    "crates/pflow-wasm",
    "crates/pflow-hosted",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pflow-xyz/pflow-rs"
homepage = "https://pflow.xyz"

# The browser build (make wasm-npm): size over speed, as a page downloads it.
# Floats are unaffected: rustc does no fast-math at any opt-level, and the
# package's test holds the optimized module to the byte-exact SSA goldens.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
