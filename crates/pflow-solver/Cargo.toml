[package]
name = "pflow-solver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "ODE solvers for Petri net simulation using mass-action kinetics"
keywords = ["ode-solver", "petri-net", "simulation", "runge-kutta"]
categories = ["simulation", "science", "mathematics"]

[dependencies]
pflow-core = { path = "../pflow-core", version = "0.3.0" }
pflow-metamodel = { path = "../pflow-metamodel", version = "0.3.0" }
# default-features = false: only the dense-matrix null-space routines are
# needed (supply::classify_supply's P-invariant basis), not pflow-tropical's
# optional pflow-core/pflow-zk-gated conversions.
pflow-tropical = { path = "../pflow-tropical", version = "0.3.0", default-features = false }

[dev-dependencies]
# Dev-only: the golden loader. `float_roundtrip` makes serde_json parse floats
# correctly rounded (its default parser can be off by one ulp), which the
# byte-exact goldens require; tests/ssa_parity.rs and tests/ode_parity.rs
# prove it by round-trip.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
