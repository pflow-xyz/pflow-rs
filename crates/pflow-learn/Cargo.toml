[package]
name = "pflow-learn"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Parameter fitting, sensitivities, and gradient/derivative-free optimizers for Petri net ODEs"
keywords = ["ode-solver", "petri-net", "optimization", "sensitivity-analysis"]
categories = ["simulation", "science", "mathematics"]

[dependencies]
pflow-core = { path = "../pflow-core", version = "0.3.0" }
pflow-solver = { path = "../pflow-solver", version = "0.3.0" }
pflow-metamodel = { path = "../pflow-metamodel", version = "0.3.0" }

[dev-dependencies]
# float_roundtrip: goldens.json floats must parse to the exact bit pattern the
# generator wrote (bit-exact assertions in tests/parity_goldens.rs depend on it) —
# serde_json's default float parser can be off by 1 ULP without it.
serde_json = { version = "1", features = ["float_roundtrip"] }
