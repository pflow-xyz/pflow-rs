[package]
name = "pflow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Petri net modeling with ODE simulation and token model DSL"
keywords = ["petri-net", "ode-solver", "state-machine", "dsl", "token-model"]
categories = ["simulation", "science"]

[dependencies]
pflow-core = { path = "../pflow-core", version = "0.3.0" }
pflow-solver = { path = "../pflow-solver", version = "0.3.0" }
pflow-tokenmodel = { path = "../pflow-tokenmodel", version = "0.3.0" }
pflow-dsl = { path = "../pflow-dsl", version = "0.3.0" }
pflow-macros = { path = "../pflow-macros", version = "0.3.0" }
pflow-zk = { path = "../pflow-zk", version = "0.3.0", optional = true }
pflow-zk-arkworks = { path = "../pflow-zk-arkworks", version = "0.3.0", optional = true }

[features]
zk = ["dep:pflow-zk"]
zk-arkworks = ["zk", "dep:pflow-zk-arkworks"]

[dev-dependencies]
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }
pflow-zk = { path = "../pflow-zk", version = "0.3.0" }
pflow-zk-arkworks = { path = "../pflow-zk-arkworks", version = "0.3.0" }

[[bench]]
name = "sudoku_bench"
harness = false

[[example]]
name = "zk_tictactoe"
required-features = ["zk-arkworks"]

[[example]]
name = "zk_holdem"
required-features = ["zk-arkworks"]
