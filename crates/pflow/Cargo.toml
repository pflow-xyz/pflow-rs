[package]
name = "pflow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Petri net modeling with ODE simulation and token model DSL"
keywords = ["petri-net", "ode-solver", "state-machine", "dsl", "token-model"]
categories = ["simulation", "science"]

[dependencies]
pflow-core = { path = "../pflow-core", version = "0.1.1" }
pflow-solver = { path = "../pflow-solver", version = "0.1.1" }
pflow-tokenmodel = { path = "../pflow-tokenmodel", version = "0.1.1" }
pflow-dsl = { path = "../pflow-dsl", version = "0.1.1" }
pflow-macros = { path = "../pflow-macros", version = "0.1.1" }

[dev-dependencies]
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sudoku_bench"
harness = false
