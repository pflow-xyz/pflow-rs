[package]
name = "pflow-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Property verification (deadlock-free, bounded, live, invariants, reachability) for pflow-metamodel nets, ported from go-pflow's verify package"
keywords = ["petri-net", "model-checking", "verification"]
categories = ["simulation", "data-structures"]

[dependencies]
pflow-metamodel = { path = "../pflow-metamodel" }
pflow-reachability = { path = "../pflow-reachability" }
# go-pflow's Marking.Hash, the tie-break for which violating marking an
# exhaustive refutation reports.
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
