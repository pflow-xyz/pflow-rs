[package]
name = "pflow-tropical"
description = "Tropical semiring (max-plus algebra) for Petri net analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["pflow"]
pflow = ["dep:pflow-core", "dep:pflow-zk"]

[dependencies]
pflow-zk = { path = "../pflow-zk", optional = true }
pflow-core = { path = "../pflow-core", optional = true }
